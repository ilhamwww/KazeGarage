name: kaze_garage
description: "KazeGarage - Aplikasi manajemen kendaraan personal untuk pelacakan pengeluaran bahan bakar."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Database lokal (offline-first)
  sqflite: ^2.4.2
  path: ^1.9.1
  
  # State management
  provider: ^6.1.5
  
  # OCR - Pemindaian struk
  google_mlkit_text_recognition: ^0.14.0
  
  # Kamera & Galeri
  image_picker: ^1.1.2
  
  # Chart/Visualisasi data
  fl_chart: ^0.70.2
  
  # Formatting tanggal & mata uang
  intl: ^0.20.2
  
  # UUID untuk generate ID
  uuid: ^4.5.1
  
  # Permission handler
  permission_handler: ^11.4.0
  
  # HTTP client + HTML parser untuk scraping harga BBM
  http: ^1.2.2
  html: ^0.15.4

  # Backup & Restore data ke file
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  shared_preferences: ^2.3.3

  # Membaca versi aplikasi (untuk splash screen)
  package_info_plus: ^8.1.2

  # Membuka URL eksternal (download update dari GitHub Release)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/kaze_garage_icon.png"
  adaptive_icon_background: "#0A1F3D"
  adaptive_icon_foreground: "assets/icon/kaze_garage_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/icon/kaze_garage_logo.png
    - assets/icon/kaze_garage_icon.png

  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
