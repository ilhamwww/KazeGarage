name: kaze_garage
description: "KazeGarage - Aplikasi manajemen kendaraan personal untuk pelacakan pengeluaran bahan bakar."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Database lokal (offline-first)
  sqflite: ^2.4.2
  path: ^1.9.1
  
  # State management
  provider: ^6.1.5
  
  # OCR - Pemindaian struk
  google_mlkit_text_recognition: ^0.14.0
  
  # Kamera & Galeri
  image_picker: ^1.1.2
  
  # Chart/Visualisasi data
  fl_chart: ^0.70.2
  
  # Formatting tanggal & mata uang
  intl: ^0.20.2
  
  # UUID untuk generate ID
  uuid: ^4.5.1
  
  # Permission handler
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
