name: Release APK

# Trigger:
#  - Saat push git tag dengan format v* (misal v1.0.0)
#  - Atau manual lewat tab Actions (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (misal v1.0.0). Wajib diisi saat menjalankan manual.'
        required: true
        default: 'v1.0.0'

# Diperlukan agar action dapat membuat GitHub Release
permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/KazeGarage-${{ github.event.inputs.tag || github.ref_name }}.apk"

      - name: Create GitHub Release & upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: KazeGarage ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk